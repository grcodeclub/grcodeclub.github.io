<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://grcodeclub.gr/files-page/preview/main.jpg"/>
    <meta property="og:title" content="GrCode Club">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrCode Club</title>
    <script src="https://grcodeclub.github.io/js/data.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="addHeader"></div>

    <div class="container">
        <!-- Input Section -->
        <div id="inputContainer">
            <div>
                <select id="itemSelect" class="form-select" aria-label="Επιλογή στοιχείου">
                    <option value="title">Εισάγετε τίτλο</option>
                    <option value="text">Εισάγετε κείμενο</option>
                    <option value="unity">Εισάγετε τίτλο ενότητα</option>
                    <option value="mycode">Εισάγετε Html κώδικα</option>
                    <option value="image">Εισάγετε URL εικόνας</option>
                    <option value="programming"> Εισαγωγή κώδικα</option>
                    <option value="mycode_table">Εισαγωγή πίνακα </option>
                </select>
            </div>
        </div>
        <br>
        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button onclick="addNewItem()" class="btn btn-primary">Προσθήκη Νέου Στοιχείου</button>
            <button onclick="downloadHTML()" class="btn btn-secondary">Κατέβασμα HTML</button>
            <a href="https://forms.gle/mbdD7DWc25f755Dj8" target="_blank" class="btn btn-success">Upload GitHub GrCodeClub</a>
        </div>

        <!-- Content Section (Dynamic Elements will be added here) -->
        <div id="contentSection"></div>
    </div>

    <!-- Footer -->
    <div id="addFooter"></div>


    <!-- Custom Scripts -->
    <script src="./create.js"></script>
    <script src="./input.js"></script>
    <script src="./AddRaw.js"></script>
</body>
</html>
