
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://grcodeclub.github.io/files-page/preview/main.png"/>
    <meta property="og:title" content="GrCode Club">
    <title>GrCode Club</title>
    <script src="https://grcodeclub.github.io/js/data.js"></script>
    </head>
<body>
    <div id="addHeader"></div>
    <div class="container">
      <h1 class="title">GUIZ</h1>
      <label for="page-select">Επιλέξτε αρχείο ερωτήσεων:</label>
      <select class="form-select" id="page-select">
        <option value="-.json">-</option>
          <option value="./data/programming/html.json">HTML</option>
          <option value="./data/network/ip_address.json">IP Address</option>
      </select>
      <button id="load-btn"  class="btn bg-dark" style="color: white;">Φόρτωση Ερωτήσεων</button>
      <div id="quiz-container"></div>
      <button id="submit-btn" class="btn bg-dark" style="color: white;">Υποβολή</button>
      <div id="results" class="hidden"></div>
    
  </div>


      <script src="script.js"></script>
      <script>window.onload = function() {
        const select = document.getElementById('page-select');
        const currentUrl = window.location.href; // Παίρνουμε το τρέχον URL
        console.log(select);
        console.log(select.options);
        // Έλεγχος για να βρούμε το κατάλληλο option
        for (let option of select.options) {
             console.log(currentUrl, option.value);
            if (option.value === currentUrl) {
                select.value = option.value; // Ρύθμιση του επιλεγμένου option
                console.log(select.value);
                break;
            }
        }
    
                // Εφαρμογή του Select2
                $('#page-select').select2();
    
              
    };
    </script>  
    </div>
    <div id="addFooter"></div>

</body>
</html>
