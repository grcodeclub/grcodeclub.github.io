<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@grcodeclub">
    <meta name="twitter:title" content="GrCode Club">
    <meta name="twitter:image" content="https://grcodeclub.github.io/files-page/preview/main.jpg"/>
    <meta property="og:image" content="https://grcodeclub.github.io/files-page/preview/main.jpg"/>
    <meta property="og:title" content="GrCode Club">
    <script src="https://grcodeclub.github.io/js/data.js"></script>
    <style>
        a{color:black;text-decoration: none;}
        .filters { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="addHeader"></div>
    <div class="container">
        <!-- Πεδίο Αναζήτησης και Φίλτρο -->
        <div class="filters">
            <input type="text" class="form-control" id="search_table_page" placeholder="Αναζήτηση"><br>
            <select id="filterCategory" class="form-control">
                <option value="">Όλες οι Κατηγορίες</option>
                <option value="tech">Τεχνολογία</option>
                <option value="social">Social Media</option>
                <option value="office">Office</option>
                <option value="career">Καριέρα</option>
                <option value="quiz">Quiz</option>
                <option value="color">RGB</option>
            </select><br>
        </div>

        <div id="cardContainer"></div>
        <nav aria-label="Σελιδοποίηση">
            <ul id="pagination" class="pagination justify-content-left">
                <!-- Οι σελίδες θα προστεθούν εδώ από το JavaScript -->
            </ul>
        </nav>    


  <script>
    const itemsPerPage = 5;
    let currentPage = 1;
    let data = [];

    const sources = [
      './data.json'
    ];

    async function loadData() {
      const allData = [];
      for (const url of sources) {
        try {
          const res = await fetch(url);
          const json = await res.json();
          allData.push(...json);
        } catch (e) {
          console.warn('Αποτυχία φόρτωσης:', url);
        }
      }
      // ταξινόμηση κατά ημερομηνία φθίνουσα
      data = allData.sort((a, b) => new Date(b.date) - new Date(a.date));
      filterAndRender();
    }

    function removeDiacritics(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function displayCards(filteredData) {
      const container = document.getElementById("cardContainer");
      container.innerHTML = "";
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginated = filteredData.slice(start, end);

      paginated.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
              <div class="card-header"><h5 class="card-title">${item.title}</h5></div>
              <div class="card-body"><p>${item.description}</p>
                <a href="${item.link}" class="btn btn-dark">περισσότερα...</a></div>
              <div class="card-footer">
                <small>${item.date} | ${item.author}</small>
              </div>
            `;
        container.appendChild(div);
        container.appendChild(document.createElement("br"));
      });

      updatePagination(filteredData.length);
    }

   // Ενημέρωση κουμπιών σελιδοποίησης
   function updatePagination(totalItems) {
    pagination.innerHTML = "";
    const totalPages = Math.ceil(totalItems / itemsPerPage);

    if (totalPages <= 1) return;

    // Προηγούμενη
    if (totalPages > 5) {
        const prev = document.createElement("li");
        prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
        prev.innerHTML = `<br><a class="page-link" href="#">Προηγούμενη</a>`;
        prev.addEventListener("click", (e) => {
            e.preventDefault();
            if (currentPage > 1) {
                currentPage--;
                filterAndRender();
            }
        });
        pagination.appendChild(prev);
    }

    // Υπολογισμός εύρους αριθμών
    let startPage = Math.max(currentPage - 2, 1);
    let endPage = Math.min(startPage + 4, totalPages);
    if (endPage - startPage < 4) {
        startPage = Math.max(endPage - 4, 1);
    }

    for (let i = startPage; i <= endPage; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? "active" : ""}`;
        li.innerHTML = `<br><a class="page-link" href="#">${i}</a>`;
        li.addEventListener("click", (e) => {
            e.preventDefault();
            currentPage = i;
            filterAndRender();
        });
        pagination.appendChild(li);
    }

    // Επόμενη
    if (totalPages > 5) {
        const next = document.createElement("li");
        next.className = `page-item ${currentPage === totalPages ? "disabled" : ""}`;
        next.innerHTML = `<br><a class="page-link" href="#">Επόμενη</a>`;
        next.addEventListener("click", (e) => {
            e.preventDefault();
            if (currentPage < totalPages) {
                currentPage++;
                filterAndRender();
            }
        });
        pagination.appendChild(next);
    }
}


    function filterAndRender() {
      const query = removeDiacritics(document.getElementById("search_table_page").value.toLowerCase());
      const category = document.getElementById("filterCategory").value;

      const filtered = data.filter(item => {
        const title = removeDiacritics(item.title.toLowerCase());
        const matchesSearch = title.includes(query);
        const matchesCategory = !category || item.category === category;
        return matchesSearch && matchesCategory;
      });

      displayCards(filtered);
    }

    document.getElementById("search_table_page").addEventListener("input", () => {
      currentPage = 1;
      filterAndRender();
    });

    document.getElementById("filterCategory").addEventListener("change", () => {
      currentPage = 1;
      filterAndRender();
    });

    // αρχική φόρτωση
    loadData();
  </script>
        
</body>
</html>
